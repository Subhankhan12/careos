# DESTINATION: /etc/logrotate.d/careos
#   sudo logrotate -d /etc/logrotate.d/careos     # -d = dry run, prints what it WOULD do
#   sudo logrotate -f /etc/logrotate.d/careos     # force one rotation to prove it works
#
# READ THIS BEFORE INSTALLING — most of this file is deliberately commented out.
#
# The single most common logrotate mistake on a Laravel box is rotating files the application
# already rotates itself. Whether that applies here depends entirely on one env key, so check it
# first:
#
#   grep '^LOG_STACK' .env
#
# ---------------------------------------------------------------------------------------------
# CASE A — LOG_STACK=daily  (what docs/DEPLOY-ENV.production.template:40 ships)
# ---------------------------------------------------------------------------------------------
# Monolog rotates AND prunes by itself: config/logging.php:68-72 defines the daily driver with
# 'days' => env('LOG_DAILY_DAYS', 14). Files are named storage/logs/laravel-YYYY-MM-DD.log.
#
#   >>> INSTALL NOTHING for the app log in this case. <<<
#
# Adding a logrotate rule on top produces laravel-2026-09-20.log.1.gz alongside Monolog's own
# dated files, double-compressing history and confusing every later `tail`.
#
# Note the knock-on effect this has on the capture protocol: under LOG_STACK=daily there is no
# storage/logs/laravel.log at all, so `tail storage/logs/laravel.log` — which
# DEPLOY-CHECKLIST.md:370 tells you to run — reads a file that does not exist. Part 6 of this
# pack uses a glob for exactly that reason.
#
# ---------------------------------------------------------------------------------------------
# CASE B — LOG_STACK unset, or set to 'single'  (what DEPLOY-RUNBOOK.md:148-150 produces)
# ---------------------------------------------------------------------------------------------
# config/logging.php:57 is 'channels' => explode(',', env('LOG_STACK', 'single')), so an unset
# key means the single driver: ONE storage/logs/laravel.log that grows forever and is never
# pruned. The runbook's .env block omits LOG_STACK entirely, so an operator who follows it gets
# this case while the env template's reader gets Case A. Two documents, two different files on
# disk.
#
# If you are in Case B, uncomment this block:
#
# /var/www/careos/storage/logs/laravel.log {
#     daily
#     rotate 14
#     missingok
#     notifempty
#     compress
#     delaycompress
#     copytruncate
#     su www-data www-data
#     create 0640 www-data www-data
# }
#
# copytruncate is used rather than create+reload because nothing signals PHP-FPM to reopen its
# log handle; truncating in place is the safe option for a file the app holds open.
#
# ---------------------------------------------------------------------------------------------
# CASE C — Horizon under SUPERVISOR, not systemd
# ---------------------------------------------------------------------------------------------
# DEPLOY-RUNBOOK.md:327 sets stdout_logfile=/var/www/careos/storage/logs/horizon.log. Nothing
# rotates that file — not Monolog (it is Supervisor's stdout capture, not an app log channel)
# and not Supervisor itself beyond its own size cap. On a busy queue it grows without bound.
#
# THIS PACK'S systemd UNIT DOES NOT PRODUCE THIS FILE. docs/deploy/careos-horizon.service sends
# stdout and stderr to journald, which rotates itself (see journald.conf SystemMaxUse). So if
# you followed Part 2 and used systemd, skip this block entirely.
#
# Only if you chose Supervisor, uncomment:
#
# /var/www/careos/storage/logs/horizon.log {
#     weekly
#     rotate 8
#     missingok
#     notifempty
#     compress
#     delaycompress
#     copytruncate
#     su www-data www-data
#     create 0640 www-data www-data
# }
#
# ---------------------------------------------------------------------------------------------
# NGINX — nothing to do. Ubuntu already ships /etc/logrotate.d/nginx, and it covers the
# careos-access.log / careos-error.log files declared in docs/deploy/nginx-careos.conf because
# that rule globs /var/log/nginx/*.log. Do not add a second rule for them.
# ---------------------------------------------------------------------------------------------
