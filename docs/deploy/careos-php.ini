; DESTINATION: BOTH of these, then restart FPM
;   /etc/php/8.2/fpm/conf.d/99-careos.ini
;   /etc/php/8.2/cli/conf.d/99-careos.ini
;   sudo systemctl restart php8.2-fpm
;
; The CLI copy matters as much as the FPM one: artisan, Horizon and every scheduled command run
; under the CLI ini, and it is a DIFFERENT file from FPM's. Confirm which is loaded with
;   php -i | grep '^Loaded Configuration File'
;   php-fpm8.2 -i | grep '^Loaded Configuration File'
;
; No deploy document in this repo sets a single php.ini value. These three are derived from the
; code and all three are load-bearing. See docs/deploy/01-system-requirements.md §1.2.

; ---------------------------------------------------------------------------------------------
; UPLOADS. The largest real limit in the app is 10 MiB, in two places:
;   Modules/Clinical/src/Http/Controllers/DocumentUploadController.php:25   'max:10240'
;   Modules/Dental/src/Http/Controllers/DentalImageController.php:83        'max:10240'
; Laravel's max: on a file rule is KILOBYTES, so 10240 KB = 10 MiB = 10,485,760 bytes.
; (The CSV import is smaller: Modules/Import/.../ImportBatchController.php:58 uses 'max:5120'.)
;
; PHP ships upload_max_filesize=2M and post_max_size=8M. Left at those defaults, nginx accepts a
; 10 MiB clinical document (its limit is 25M) and PHP then discards it — and because the file
; never arrives, Laravel's validator reports "A file is required" rather than a size error. The
; upload appears to fail for the wrong reason, which is why this is worth writing down.
;
; post_max_size must exceed upload_max_filesize to leave room for the rest of the multipart body.
; ---------------------------------------------------------------------------------------------
upload_max_filesize = 12M
post_max_size = 16M

; ---------------------------------------------------------------------------------------------
; MEMORY. config/horizon.php:208 restarts a worker once it exceeds 'memory' => 128 (MB). That is
; a post-job restart threshold Horizon polls between jobs, not an enforced cap — so the PHP
; memory_limit must sit comfortably ABOVE it or the process dies mid-job instead of recycling
; cleanly between jobs.
; ---------------------------------------------------------------------------------------------
memory_limit = 256M

; ---------------------------------------------------------------------------------------------
; OPCACHE. Not required by anything in this repo — included because a production PHP without it
; is needlessly slow, and because release.sh's `php artisan *:cache` steps assume warm bytecode.
; opcache.validate_timestamps=0 means PHP never re-checks files on disk, so a deploy MUST reload
; FPM to pick up new code — docs/deploy/release.sh does exactly that. If you would rather not
; depend on the reload, set validate_timestamps=1 and delete the revalidate_freq line.
; ---------------------------------------------------------------------------------------------
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
