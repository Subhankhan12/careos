# DESTINATION: /etc/nginx/sites-available/careos
#   sudo ln -s /etc/nginx/sites-available/careos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.careos.example      # adds the TLS listener + redirect
#
# Derived from this repo at 73d8ed9. Differences from docs/DEPLOY-RUNBOOK.md:374-401 are
# marked [FIX] and explained; everything unmarked matches the runbook.
#
# Forge/Ploi: they generate their own server block. Port the three [FIX] blocks into it —
# especially the /nurse-pwa/ one, which their default template cannot know about.

server {
    listen 80;
    listen [::]:80;
    server_name app.careos.example;

    root /var/www/careos/public;

    # [FIX] index.html added. The runbook declares only `index index.php`, but the Nurse PWA's
    # entry point is a static file: nurse-pwa/vite.config.ts:30 outputs to ../public/nurse-pwa
    # with base '/nurse-pwa/' (:7) and start_url '/nurse-pwa/' (:18). There is NO Laravel route
    # for it — `grep -rn nurse-pwa routes/` returns nothing — so without index.html the request
    # falls through to Laravel and 404s, and the runbook's own go-live check at :446 ("the Nurse
    # PWA (/nurse-pwa) loads its day-pack") cannot pass.
    index index.php index.html;

    charset utf-8;

    # Sized from the real validation rules, not a guess:
    #   Modules/Clinical/src/Http/Controllers/DocumentUploadController.php:25  max:10240 (10 MiB)
    #   Modules/Dental/src/Http/Controllers/DentalImageController.php:83       max:10240 (10 MiB)
    #   Modules/Import/src/Http/Controllers/ImportBatchController.php:58       max:5120  (5 MiB)
    # Laravel's max: on a file rule is KILOBYTES. 25M clears the largest with headroom for the
    # rest of the multipart body.
    #
    # THIS VALUE IS USELESS ON ITS OWN. PHP's stock upload_max_filesize is 2M, so nginx accepts
    # the upload and PHP silently discards it — the user sees "A file is required", not a size
    # error. Install docs/deploy/careos-php.ini as well. See Part 1 §1.2.
    client_max_body_size 25M;

    # ---------------------------------------------------------------------------------------
    # [FIX] The Nurse PWA — a static SPA served from its own path prefix.
    # ^~ so this wins over the regex asset location below and the service worker is never
    # captured by a long-cache rule.
    # ---------------------------------------------------------------------------------------
    location ^~ /nurse-pwa/ {
        try_files $uri $uri/ /nurse-pwa/index.html;

        # The service worker MUST NOT be cached. nurse-pwa/vite.config.ts:11 sets
        # registerType: 'autoUpdate' — a cached sw.js pins every nurse device to a stale
        # precache manifest that autoUpdate can then never replace.
        location = /nurse-pwa/sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }
        location = /nurse-pwa/index.html {
            add_header Cache-Control "no-cache" always;
            expires -1;
        }
    }

    # Vite's fingerprinted bundle. Safe to cache hard — filenames change every build.
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # /var/run is a symlink to /run on modern Ubuntu, so the runbook's
        # /var/run/php/php8.2-fpm.sock (DEPLOY-RUNBOOK.md:393) is the same socket.
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # The CSV import reads the whole upload into memory and writes one row per record
        # inside a transaction (Modules/Import/src/Services/ImportBatchService.php:46 reads the
        # file; :68-75 loops). A 5 MiB import is synchronous and can outrun the 60s default.
        fastcgi_read_timeout 180;
    }

    location ~ /\.(?!well-known).* { deny all; }

    # ---------------------------------------------------------------------------------------
    # [FIX] Security headers. Verified NOT set anywhere in the app: there is no global
    # security-headers middleware (app/Http/Middleware/ holds only ApplyTenantLocaleTimezone
    # and HandleInertiaRequests), and no Content-Security-Policy, X-Frame-Options or
    # Strict-Transport-Security string exists in app/ or Modules/.
    #
    # X-Content-Type-Options is the one exception: six file-download controllers set it
    # per-response (e.g. Modules/Clinical/src/Http/Controllers/DocumentDownloadController.php:25),
    # so on those routes you will see it twice. Duplicate identical values are harmless.
    #
    # HSTS is commented out deliberately — enable it only AFTER certbot has run and HTTPS is
    # confirmed working, because it is hard to walk back from a browser that has cached it.
    # ---------------------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # DO NOT add an Access-Control-Allow-Origin header here.
    # config/cors.php does not exist in this repo, so Laravel's packaged default applies and
    # HandleCors is still in the global stack: it already answers /api/* with a wildcard origin.
    # Adding one in nginx duplicates the header and breaks every browser CORS check.

    # DO NOT add `fastcgi_param HTTPS on;` unless you terminate TLS somewhere other than this
    # nginx. The app configures no trusted proxies (bootstrap/app.php never calls
    # ->trustProxies()), so scheme detection relies on this server terminating TLS itself.
    # Put a load balancer or CDN in front and HTTPS detection breaks with no knob to fix it.

    access_log /var/log/nginx/careos-access.log;
    error_log  /var/log/nginx/careos-error.log;
}
